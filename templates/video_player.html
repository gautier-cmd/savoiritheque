<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ media['relative_path'].rsplit('/', 1)[-1] }} - Savoirthèque</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        a.back {
            color: #999;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 1.2em;
            margin-bottom: 15px;
        }

        video {
            width: 100%;
            border-radius: 8px;
            display: block;
            background: black;
        }
    </style>
</head>
<body>
    <div class="container">
        <a class="back" href="javascript:history.back()">← Retour</a>
        <h1>{{ media['relative_path'].rsplit('/', 1)[-1] }}</h1>
        <video controls src="{{ url_for('media_file', media_id=media['id']) }}"></video>
    </div>
</body>
</html>
