{% macro type_icon(item_type, size='40%') %}
{% if item_type == 'course' %}
<svg viewBox="0 0 24 24" width="{{ size }}" height="{{ size }}" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
{% elif item_type == 'book' %}
<svg viewBox="0 0 24 24" width="{{ size }}" height="{{ size }}" fill="currentColor"><path d="M12 5.2c-2-1.1-4.5-1.5-7-1.3v14.6c2.5-.2 5 .2 7 1.3 2-1.1 4.5-1.5 7-1.3V3.9c-2.5-.2-5 .2-7 1.3z"/></svg>
{% elif item_type == 'audiobook' %}
<svg viewBox="0 0 24 24" width="{{ size }}" height="{{ size }}" fill="currentColor"><path d="M12 3a7 7 0 0 0-7 7v5.5A2.5 2.5 0 0 0 7.5 18H8a1 1 0 0 0 1-1v-5a1 1 0 0 0-1-1h-1.5v-1a5.5 5.5 0 0 1 11 0v1H16a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1h.5a2.5 2.5 0 0 0 2.5-2.5V10a7 7 0 0 0-7-7z"/></svg>
{% else %}
<svg viewBox="0 0 24 24" width="{{ size }}" height="{{ size }}" fill="currentColor"><path d="M6 2h9l3 3v17H6zm8 1.5V6h2.5z"/></svg>
{% endif %}
{% endmacro %}
